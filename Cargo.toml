[package]
name = "scratch-off"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
clap = "4.6.7"
color-eyre = "0.6.5"
eyre = "0.6.14"
crossterm = "0.29.0"
futures = "0.3.34"
itertools = "0.15.0"
rand = "0.10.3"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = "0.28.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libp2p = { version = "0.57.0", features = ["full"] }
chrono = "0.4.45"
